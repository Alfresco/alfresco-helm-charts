coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, condensed_files, components"
  require_changes: true

# Each chart is uploaded under its own flag by the lint matrix job so coverage
# can be tracked per chart. alfresco-common is a library chart and is excluded
# from chart testing, so it has no coverage flag/component.
flag_management:
  default_rules:
    carryforward: true

component_management:
  individual_components:
    - component_id: activemq
      name: activemq
      paths:
        - charts/activemq/**
    - component_id: alfresco-activiti
      name: alfresco-activiti
      paths:
