coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        paths:
          - "!charts/alfresco-search-service/**"
    patch:
      default:
        target: auto
        threshold: 0%

comment:
  layout: "condensed_header, condensed_files, components"
  require_changes: true
  show_carryforward_flags: true

github_checks:
  annotations: true

# alfresco-search-service is unsupported: keep it out of the reported total.
ignore:
  - charts/alfresco-search-service/**

# Unit-test reports include coverage for alfresco-common helpers as chart
# dependencies, so expose that coverage as its own component.
flag_management:
  default_rules:
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: 50%
      - type: patch
        target: 80%
        threshold: 0%
  individual_components:
    - component_id: activemq
      name: activemq
      paths:
        - charts/activemq/**
      statuses:
        - type: project
          informational: true
        - type: patch
          informational: true
    - component_id: alfresco-activiti
      name: alfresco-activiti
      paths:
        - charts/alfresco-activiti/**
    - component_id: alfresco-activiti-admin
      name: alfresco-activiti-admin
      paths:
        - charts/alfresco-activiti-admin/**
    - component_id: alfresco-adf-app
      name: alfresco-adf-app
      paths:
        - charts/alfresco-adf-app/**
    - component_id: alfresco-ai-transformer
      name: alfresco-ai-transformer
      paths:
        - charts/alfresco-ai-transformer/**
    - component_id: alfresco-audit-storage
      name: alfresco-audit-storage
      paths:
        - charts/alfresco-audit-storage/**
    - component_id: alfresco-common
      name: alfresco-common
      paths:
        - charts/alfresco-common/**
        - charts/*/charts/alfresco-common/**
    - component_id: alfresco-connector-cic
      name: alfresco-connector-cic
      paths:
        - charts/alfresco-connector-cic/**
    - component_id: alfresco-connector-ms365
      name: alfresco-connector-ms365
      paths:
        - charts/alfresco-connector-ms365/**
    - component_id: alfresco-connector-msteams
      name: alfresco-connector-msteams
      paths:
        - charts/alfresco-connector-msteams/**
    - component_id: alfresco-repository
      name: alfresco-repository
      paths:
        - charts/alfresco-repository/**
    - component_id: alfresco-search-community
      name: alfresco-search-community
      paths:
        - charts/alfresco-search-community/**
    - component_id: alfresco-search-enterprise
      name: alfresco-search-enterprise
      paths:
        - charts/alfresco-search-enterprise/**
    - component_id: alfresco-search-service
      name: alfresco-search-service
      paths:
        - charts/alfresco-search-service/**
      statuses:
        - type: project
          informational: true
        - type: patch
          informational: true
    - component_id: alfresco-share
      name: alfresco-share
      paths:
        - charts/alfresco-share/**
    - component_id: alfresco-sync-service
      name: alfresco-sync-service
      paths:
        - charts/alfresco-sync-service/**
    - component_id: alfresco-transform-service
      name: alfresco-transform-service
      paths:
        - charts/alfresco-transform-service/**
    - component_id: elastic
      name: elastic
      paths:
        - charts/elastic/**
      statuses:
        - type: project
          informational: true
        - type: patch
          informational: true
    - component_id: postgres
      name: postgres
      paths:
        - charts/postgres/**
      statuses:
        - type: project
          informational: true
        - type: patch
          informational: true
