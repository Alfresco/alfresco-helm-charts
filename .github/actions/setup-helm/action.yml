---
name: Setup Helm
description: Install the Helm version pinned in .tool-versions
runs:
  using: composite
  steps:
    # azure/setup-helm v5.0.1 lacks the version-file input
    - name: Read Helm version
      id: helm-version
      shell: bash
      run: echo "version=$(awk '$1 == "helm" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")" >> "$GITHUB_OUTPUT"

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: ${{ steps.helm-version.outputs.version }}
