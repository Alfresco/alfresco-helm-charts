name: Lint and Test Charts

on:
  workflow_dispatch:
    inputs:
      all-charts:
        description: Run lint and unit-test coverage for all eligible charts
        type: boolean
        default: true
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yaml'
      - 'test-deps.yaml'
      - 'codecov.yml'
      - '!charts/**/README.md'
      - '!charts/**/README.md.gotmpl'
      - '!charts/**/docs/**'
  pull_request_review:
    types:
      - submitted

env:
  TEST_ALL_CHARTS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.all-charts) || contains(github.event.pull_request.labels.*.name, 'ci-test-all')) && 'true' || 'false' }}
  CHART_TESTING_VERSION: v3.14.0
  # helm-unittest ref built from source to get --coverage support (PR #938).
  # Swap this for a release pin (HELM_UNITTEST_VERSION) once a tagged release
  # ships the coverage feature.
  HELM_UNITTEST_REF: e06eae3765d849f9c4ef9c7308a7b2db7bdd716c
  # alfresco-common is a library chart, excluded from chart-testing as it cannot
  # be rendered on its own. Its helpers are unit-tested through this consumer
  # chart, which only goes through the lint job.
  COMMON_TEST_CHART: charts/alfresco-common/tests/consumer
jobs:
  list-changed:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        github.event.pull_request.user.login == 'github-actions[bot]') ||
      github.event_name != 'pull_request_review'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-changes: ${{ steps.set-matrix.outputs.has-changes }}
      lint-matrix: ${{ steps.set-matrix.outputs.lint-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-helm@v19.15.0
        with:
          version-file: .tool-versions

      - name: List changed files
        id: pr-changes
        uses: Alfresco/alfresco-build-tools/.github/actions/github-list-changes@v19.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: ${{ env.CHART_TESTING_VERSION }}

      - name: List changed charts and create matrix
        id: set-matrix
        run: |
          if [[ "$TEST_ALL_CHARTS" == "true" ]] || echo "${{ steps.pr-changes.outputs.all_changed_files }}" | grep -qE '^(test-deps\.yaml|codecov\.yml)$'; then
            charts=$(make list-charts)
          else
            charts=$(ct list-changed --config ct.yaml)
          fi

          if [[ -n "$charts" ]]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            # Convert newline-separated list to JSON array
            matrix=$(echo "$charts" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "matrix=$matrix" >> $GITHUB_OUTPUT
            echo "Changed charts:"
            echo "$charts"
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "No charts changed"
          fi

          # The lint job also tests the alfresco-common consumer chart, the install job does not
          lint_charts=$(printf '%s\n%s' "$charts" "$COMMON_TEST_CHART")

          echo "lint-matrix=$(echo "$lint_charts" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT

  build-plugin:
    needs: list-changed
    if: needs.list-changed.outputs.lint-matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helm-unittest with coverage support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helm-unittest/helm-unittest
          ref: ${{ env.HELM_UNITTEST_REF }}
          path: helm-unittest-src

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helm-unittest-src/go.mod
          cache-dependency-path: helm-unittest-src/go.sum

      - name: Build helm-unittest plugin binary
        working-directory: helm-unittest-src
        run: >-
          go build
          -o untt-linux-amd64
          -ldflags "-X github.com/helm-unittest/helm-unittest/internal/build.version=${HELM_UNITTEST_REF:0:7}-coverage -extldflags '-static'"
          ./cmd/helm-unittest

      - name: Upload plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-unittest-plugin
          path: |
            helm-unittest-src/untt-linux-amd64
            helm-unittest-src/plugin.yaml
          if-no-files-found: error
          retention-days: 1

  lint:
    needs:
      - list-changed
      - build-plugin
    if: needs.list-changed.outputs.lint-matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      id-token: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.list-changed.outputs.lint-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-helm@v19.15.0
        with:
          version-file: .tool-versions

      - name: Download helm-unittest plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-unittest-plugin
          path: helm-unittest-plugin

      - name: Install helm-unittest plugin
        run: |
          plugins_dir="$(helm env | sed -n 's/^HELM_PLUGINS="\(.*\)"$/\1/p')"
          dest="${plugins_dir}/helm-unittest"
          mkdir -p "$dest"
          cp helm-unittest-plugin/untt-linux-amd64 helm-unittest-plugin/plugin.yaml "$dest/"
          chmod +x "$dest/untt-linux-amd64"
          helm unittest --help > /dev/null

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: ${{ env.CHART_TESTING_VERSION }}

      - name: Resolve chart name
        id: chart
        run: |
          if [[ "${{ matrix.chart }}" == "$COMMON_TEST_CHART" ]]; then
            echo "name=alfresco-common" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(basename '${{ matrix.chart }}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: matrix.chart != env.COMMON_TEST_CHART
        run: ct lint --config ct.yaml --charts ${{ matrix.chart }}

      - name: Lint alfresco-common consumer chart
        if: matrix.chart == env.COMMON_TEST_CHART
        run: |
          helm dependency update ${{ matrix.chart }}
          helm lint ${{ matrix.chart }}

      - name: Generate coverage report
        run: helm unittest ${{ matrix.chart }} --color=auto --coverage-file ${{ matrix.chart }}/coverage.xml --coverage-format cobertura

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ matrix.chart }}/coverage.xml
          flags: ${{ steps.chart.outputs.name }}
          name: ${{ steps.chart.outputs.name }}
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

  install:
    needs: list-changed
    if: needs.list-changed.outputs.has-changes == 'true' && github.event_name != 'workflow_dispatch' && ! github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    env:
      INSTALL_NAMESPACE: alfresco
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.list-changed.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-helm@v19.15.0
        with:
          version-file: .tool-versions

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: ${{ env.CHART_TESTING_VERSION }}

      - name: Create kind cluster
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-kind@v19.15.0
        with:
          ingress-nginx-ref: skip

      - name: Login to Quay.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.quay_username }}
          password: ${{ secrets.quay_password }}

      - name: Get Activiti License from S3
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACSLICENSE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_ACSLICENSE_SECRET_ACCESS_KEY }}
        run: aws s3 cp s3://aps-licenses/single-tenant/activiti.lic /tmp/activiti.lic

      - name: Prepare namespace for install
        run: |
          kubectl create ns "$INSTALL_NAMESPACE"
          kubectl create secret generic quay-registry-secret --from-file=.dockerconfigjson="${HOME}"/.docker/config.json --type=kubernetes.io/dockerconfigjson -n "$INSTALL_NAMESPACE"
          kubectl create secret generic broker-secret --from-literal=BROKER_URL="failover:(nio://activemq:61616)?timeout=3000" --from-literal=BROKER_USERNAME=admin --from-literal=BROKER_PASSWORD=admin -n "$INSTALL_NAMESPACE"
          kubectl create secret generic aps-license --from-file=activiti.lic=/tmp/activiti.lic -n "$INSTALL_NAMESPACE"

      - name: Prepare charts mocks for testing
        run: |
          if [ -d "${{ matrix.chart }}/ci/kustomize/" ]; then
            echo "Prepare mocks for ${{ matrix.chart }}"
            pushd "${{ matrix.chart }}/ci/kustomize/"
            kubectl kustomize --enable-helm . | \
              kubectl -n "$INSTALL_NAMESPACE" apply -f -
            popd
          fi

      - name: Setup test dependencies
        run: ./scripts/ci-deps.sh setup ${{ matrix.chart }} "$INSTALL_NAMESPACE"

      - name: Run chart-testing (install)
        run: >-
          ct install --config ct.yaml
          --namespace "$INSTALL_NAMESPACE"
          --charts ${{ matrix.chart }}
