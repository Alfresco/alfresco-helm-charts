---
name: Pre-commit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  pull_request_review:
    types:
      - submitted

jobs:
  pre_commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        github.event.pull_request.user.login == 'github-actions[bot]') ||
      github.event_name != 'pull_request_review'
    permissions:
      contents: write
    steps:
      - name: Ensure SHA pinned actions
        uses: hyland/github-actions-ensure-sha-pinned-actions@v2.0.1
        with:
          allowlist: |
            Alfresco/alfresco-build-tools/

      - name: Setup helm docs
        uses: Alfresco/alfresco-build-tools/.github/actions/setup-helm-docs@v18.28.3

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Install kubeconform helm plugin
        run: >-
          helm plugin install https://github.com/jtyr/kubeconform-helm
          --version v0.2.0
          --verify=false

      - name: Run pre-commit
        uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v18.28.3
        with:
          # disable auto-commit for PRs from forks
          auto-commit: ${{ github.event_name != 'pull_request' || ! github.event.pull_request.head.repo.fork }}
          python-version: 3.12
