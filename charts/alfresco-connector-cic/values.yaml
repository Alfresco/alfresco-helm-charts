imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# -- Additional labels to be added to all resources (deployments, statefulsets, services, pods, etc.)
# Example:
#   Product: k8s
#   Environment: DEV
additionalLabels: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
liveIngester:
  image:
    repository: quay.io/alfresco/alfresco-cic-connector-live-ingester
    tag: 1.0.1
    pullPolicy: IfNotPresent
    internalPort: &liveIngesterPort 8080
  replicaCount: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  resources:
    requests:
      cpu: "0.5"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "2048Mi"
  environment:
    SERVER_PORT: *liveIngesterPort
    ALFRESCO_BULKINGESTER_ENDPOINT: activemq:queue:bulk-ingester-events
    ALFRESCO_BULKINGESTER_DEADLETTERENABLED: "false"
    ALFRESCO_BULKINGESTER_DEADLETTERURI: activemq:queue:ActiveMQ.DLQ
    ALFRESCO_BULKINGESTER_MAXIMUMREDELIVERIES: "6"
    ALFRESCO_BULKINGESTER_REDELIVERYDELAYMS: "1000"
    CAMEL_COMPONENT_ACTIVEMQ_TRANSACTED: "true"
  livenessProbe:
    initialDelaySeconds: 30
    httpGet:
      path: /actuator/health/liveness
      port: *liveIngesterPort
  readinessProbe:
    initialDelaySeconds: 40
    httpGet:
      path: /actuator/health/readiness
      port: *liveIngesterPort
  service:
    name: cic-live-ingester-service
    type: ClusterIP
    externalPort: 80
    annotations: {}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        # -- Prefer to schedule the content pod on a different zone
        - weight: 10
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - >-
                      {{ template "alfresco-connector-cic.name" $ }}
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - "{{ $.Release.Name }}"
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - "{{ $.Chart.Name }}"
            topologyKey: topology.kubernetes.io/zone
        # -- Prefer to schedule the content pod on a different node
        - weight: 5
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - >-
                      {{ template "alfresco-connector-cic.name" $ }}
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - "{{ $.Release.Name }}"
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - "{{ $.Chart.Name }}"
            topologyKey: kubernetes.io/hostname
bulkIngester:
  enabled: true
  image:
    repository: quay.io/alfresco/alfresco-cic-connector-bulk-ingester
    tag: 1.0.1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "0.5"
      memory: "128Mi"
    limits:
      cpu: "2"
      memory: "512Mi"
  environment:
    ALFRESCO_BULK_INGEST_PUBLISHER_ENDPOINT: activemq:queue:bulk-ingester-events
  initContainers:
    waitForRepository:
      enabled: true
      image:
        repository: curlimages/curl
        tag: "8.11.0"
        pullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 250m
          memory: 20Mi
  affinity: {}
nucleusSync:
  enabled: false
  image:
    repository: quay.io/alfresco/alfresco-cic-connector-nucleus-sync
    tag: 1.0.1
    pullPolicy: IfNotPresent
    internalPort: &nucleusSyncPort 8080
  replicaCount: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  resources:
    requests:
      cpu: "0.5"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "2048Mi"
  environment:
    SERVER_PORT: *nucleusSyncPort
    AUTH_HX_TYPE: oauth2
  livenessProbe:
    initialDelaySeconds: 30
    httpGet:
      path: /actuator/health/liveness
      port: *nucleusSyncPort
  readinessProbe:
    initialDelaySeconds: 40
    httpGet:
      path: /actuator/health/readiness
      port: *nucleusSyncPort
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        # -- Prefer to schedule the content pod on a different zone
        - weight: 10
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - >-
                      {{ template "alfresco-connector-cic.name" $ }}
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - "{{ $.Release.Name }}"
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - "{{ $.Chart.Name }}"
            topologyKey: topology.kubernetes.io/zone
        # -- Prefer to schedule the content pod on a different node
        - weight: 5
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - >-
                      {{ template "alfresco-connector-cic.name" $ }}
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - "{{ $.Release.Name }}"
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - "{{ $.Chart.Name }}"
            topologyKey: kubernetes.io/hostname
db:
  # -- Provide the full JDBC url to connect to database service e.g.:
  # `jdbc:postgresql://hostname:5432/database`
  url: null
  # -- The username required to access the service
  username: null
  # -- The password required to access the service
  password: null
  existingSecret:
    # -- Alternatively, provide database credentials via an existing secret
    name: null
    keys:
      # -- Key within the secret holding the database username
      username: DATABASE_USERNAME
      # -- Key within the secret holding the database password
      password: DATABASE_PASSWORD
  existingConfigMap:
    # -- Alternatively, provide database connection details via an existing
    # configmap
    name: null
    keys:
      # -- Key within the configmap holding the full JDBC url to connect to
      # database service
      url: DATABASE_URL
messageBroker:
  # --  Broker URL formatted as per:
  # https://activemq.apache.org/failover-transport-reference
  url: null
  # -- Broker username
  username: null
  # -- Broker password
  password: null
  existingConfigMap:
    # -- Alternatively, provide message broker connection details via an existing
    # configmap
    name: null
    keys:
      # -- Key within the configmap holding the URL of the message broker
      url: BROKER_URL
  # -- Provide connection details alternatively via an existing secret that
  # contains BROKER_URL, BROKER_USERNAME and BROKER_PASSWORD keys
  existingSecret:
    name: null
    keys:
      username: BROKER_USERNAME
      password: BROKER_PASSWORD
repository:
  # -- URL of the Alfresco repository (e.g. http://alfresco:8080/alfresco)
  url: null
  # -- Base URL for the Alfresco REST API v1, used by nucleus-sync.
  # Defaults to `{url}/api/-default-/public/alfresco/versions/1` when not set.
  nucleusSyncApiUrl: null
  authType: basic
  authGrantType: null
  authTokenUrl: null
  username: null
  password: null
  clientId: null
  clientSecret: null
  versionOverride: null
  existingConfigMap:
    # -- Alternatively, provide repository connection details via an existing
    # configmap
    name: null
    keys:
      # -- Key within the configmap holding the full url to connect to the
      # alfresco repository
      url: REPOSITORY_URL
      # -- Key within the configmap holding the full Alfresco REST API v1 base
      # url (used by nucleus-sync)
      apiUrl: REPOSITORY_API_BASE_URL
      authType: REPOSITORY_AUTH_TYPE
      authGrantType: REPOSITORY_AUTH_GRANT_TYPE
      authTokenUrl: REPOSITORY_AUTH_TOKEN_URL
      versionOverride: REPOSITORY_VERSION_OVERRIDE
  existingSecret:
    name: null
    keys:
      username: REPOSITORY_USERNAME
      password: REPOSITORY_PASSWORD
      clientId: REPOSITORY_CLIENT_ID
      clientSecret: REPOSITORY_CLIENT_SECRET
ats:
  # -- URL of the alfresco shared filestore
  sfsUrl: null
  existingConfigMap:
    # -- Alternatively, provide ATS details via an existing configmap
    name: null
    keys:
      # -- Key within the configmap holding the URL of the alfresco shared filestore
      sfsUrl: SFS_URL
cic:
  hxAuthTokenUrl: null
  hxInsightIngestionUrl: null
  hxClientId: null
  hxClientSecret: null
  hxEnvKey: null
  hxAppSourceId: null
  # -- Nucleus connection settings (nucleus-sync only)
  nucleusBaseUrl: null
  nucleusIdpBaseUrl: null
  nucleusSystemId: null
  existingConfigMap:
    name: null
    keys:
      hxAuthTokenUrl: HX_AUTH_TOKEN_URL
      hxInsightIngestionUrl: HX_INSIGHT_INGESTION_URL
      nucleusBaseUrl: NUCLEUS_BASE_URL
      nucleusIdpBaseUrl: NUCLEUS_IDP_BASE_URL
      nucleusSystemId: NUCLEUS_SYSTEM_ID
  existingSecret:
    name: null
    keys:
      hxClientId: HX_CLIENT_ID
      hxClientSecret: HX_CLIENT_SECRET
      hxEnvKey: HX_ENV_KEY
      hxAppSourceId: HX_APP_SOURCE_ID
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "alfresco-connector-cic-sa"
global:
  alfrescoRegistryPullSecrets: quay-registry-secret
  # -- Global additional labels that can be set at parent/umbrella chart level
  # These will be merged with chart-level additionalLabels, with chart-level taking precedence
  additionalLabels: {}
