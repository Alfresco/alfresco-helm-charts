---
suite: test cic deployments
templates:
  - deployment-connector-cic-nucleus-sync.yaml
  - deployment-connector-cic-live-ingester.yaml
  - configmap-connector-cic.yaml
  - secret-connector-cic.yaml
  - secret-mq.yaml
tests:
  - it: should render pods annotations
    set:
      podAnnotations:
        alfresco-helm-charts.github.io/test: annotate-pods
    asserts:
      - template: deployment-connector-cic-live-ingester.yaml
        isSubset:
          path: spec.template.metadata.annotations
          content:
            alfresco-helm-charts.github.io/test: annotate-pods
      - template: deployment-connector-cic-nucleus-sync.yaml
        isSubset:
          path: spec.template.metadata.annotations
          content:
            alfresco-helm-charts.github.io/test: annotate-pods

  - it: should render labels for job
    chart:
      version: 1.0.0
      appVersion: 2.0.0
    set:
      nameOverride: testName
      additionalLabels:
        my-custom-chart-label: custom-value
      global:
        additionalLabels:
          my-global-custom-label: global-custom-value
          my-custom-chart-label: global-custom-value
    asserts:
      - template: deployment-connector-cic-nucleus-sync.yaml
        isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: alfresco-connector-cic
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: testName-nucleus-sync
            app.kubernetes.io/version: 2.0.0
            helm.sh/chart: alfresco-connector-cic-1.0.0
            my-global-custom-label: global-custom-value
            my-custom-chart-label: custom-value
      - template: deployment-connector-cic-live-ingester.yaml
        isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: alfresco-connector-cic
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: testName-live-ingester
            app.kubernetes.io/version: 2.0.0
            helm.sh/chart: alfresco-connector-cic-1.0.0
            my-global-custom-label: global-custom-value
            my-custom-chart-label: custom-value
