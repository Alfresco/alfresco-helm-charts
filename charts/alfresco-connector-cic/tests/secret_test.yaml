---
suite: test secrets
templates:
  - secret-connector-cic.yaml
  - secret-database.yaml
  - secret-mq.yaml
  - secret-repository.yaml
tests:
  - it: should fail when cic.hxClientId is not set
    template: secret-connector-cic.yaml
    values:
      - values/test_values.yaml
    set:
      cic:
        hxClientId: null
    asserts:
      - failedTemplate:
          errorMessage: cic.hxClientId is required

  - it: should fail when db.username is not set and bulkIngester is enabled
    template: secret-database.yaml
    values:
      - values/test_values.yaml
    set:
      bulkIngester:
        enabled: true
      db:
        username: null
    asserts:
      - failedTemplate:
          errorMessage: db.username is required

  - it: should fail when messageBroker.username is not set
    template: secret-mq.yaml
    values:
      - values/test_values.yaml
    set:
      messageBroker:
        username: null
    asserts:
      - failedTemplate:
          errorMessage: messageBroker.username is required

  - it: should render cic secret with correct b64-encoded values
    values:
      - values/test_values.yaml
    template: secret-connector-cic.yaml
    asserts:
      - equal:
          path: data.HX_CLIENT_ID
          value: dGVzdC1jbGllbnQtaWQ=
      - equal:
          path: data.HX_CLIENT_SECRET
          value: dGVzdC1jbGllbnQtc2VjcmV0
      - equal:
          path: data.HX_APP_SOURCE_ID
          value: dGVzdC1hcHAtc291cmNlLWlk
      - equal:
          path: data.HX_ENV_KEY
          value: ""

  - it: should render mq secret with correct b64-encoded values
    values:
      - values/test_values.yaml
    template: secret-mq.yaml
    asserts:
      - equal:
          path: data.BROKER_USERNAME
          value: YWRtaW4=
      - equal:
          path: data.BROKER_PASSWORD
          value: YWRtaW4=

  - it: should render database secret when bulkIngester is enabled
    values:
      - values/test_values.yaml
    set:
      bulkIngester:
        enabled: true
    template: secret-database.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.DATABASE_USERNAME
          value: YWxmcmVzY28=
      - equal:
          path: data.DATABASE_PASSWORD
          value: YWxmcmVzY28=

  - it: should not render database secret when bulkIngester is disabled
    values:
      - values/test_values.yaml
    set:
      bulkIngester:
        enabled: false
    template: secret-database.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render cic secret when existingSecret is provided
    values:
      - values/test_values.yaml
    set:
      cic:
        existingSecret:
          name: my-cic-secret
    template: secret-connector-cic.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render mq secret when existingSecret is provided
    values:
      - values/test_values.yaml
    set:
      messageBroker:
        existingSecret:
          name: my-mq-secret
    template: secret-mq.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render correct secret names with nameOverride
    values:
      - values/test_values.yaml
    set:
      nameOverride: mycic
      bulkIngester:
        enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mycic
        template: secret-connector-cic.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mycic-mq
        template: secret-mq.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mycic-database
        template: secret-database.yaml
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mycic-repository
        template: secret-repository.yaml
