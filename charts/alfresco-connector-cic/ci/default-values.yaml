# No real Alfresco Repository is deployed for this chart's tests. Readiness
# normally depends on reaching the repository (Camel routes only start after
# an "acsHealthy" event), but setting repository.url (env ALFRESCO_REPOSITORY_BASEURL)
# and repository.versionOverride (env ALFRESCO_REPOSITORY_VERSIONOVERRIDE) below
# fakes that health check, so the default httpGet probes can be used as-is
# here without a real repository. bulk-ingester's wait-for-repository init
# container (which blocks on an HTTP 200 from the repository) is disabled.
liveIngester:
  replicaCount: 1
  resources:
    requests:
      cpu: "0.01"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "500Mi"
bulkIngester:
  enabled: false
nucleusSync:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "0.01"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
db:
  url: jdbc:postgresql://postgresql:5432/alfresco
  username: alfresco
  password: alfresco
messageBroker:
  url: nio://activemq-broker:61616
  username: admin
  password: admin
repository:
  url: http://repository
  username: admin
  password: admin
  versionOverride: '23.3.0'
ats:
  sfsUrl: http://alfresco-transform-services-sfs
cic:
  hxAuthTokenUrl: http://hx-auth-service
  hxInsightIngestionUrl: http://hx-ingestion-service
  hxClientId: ci-client-id
  hxClientSecret: ci-client-secret
  hxAppSourceId: ci-app-source-id
  nucleusBaseUrl: http://nucleus-mock
  nucleusIdpBaseUrl: http://nucleus-idp-mock
  nucleusSystemId: test-system-id
