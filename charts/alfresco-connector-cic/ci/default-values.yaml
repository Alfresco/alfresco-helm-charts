# No repository is deployed for CI. The endpoint below returns HTTP < 400, so
# AcsHealthProbe starts the Camel routes. bulk-ingester is disabled because it
# requires a real repository.
liveIngester:
  replicaCount: 1
  resources:
    requests:
      cpu: "0.01"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "500Mi"
bulkIngester:
  enabled: false
nucleusSync:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "0.01"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
db:
  url: jdbc:postgresql://postgresql:5432/alfresco
  username: alfresco
  password: alfresco
messageBroker:
  url: nio://activemq-broker:61616
  username: admin
  password: admin
repository:
  url: https://alfresco.example.com
  username: admin
  password: admin
  versionOverride: '23.3.0'
ats:
  sfsUrl: http://alfresco-transform-services-sfs
cic:
  hxAuthTokenUrl: http://hx-auth-service
  hxInsightIngestionUrl: http://hx-ingestion-service
  hxClientId: ci-client-id
  hxClientSecret: ci-client-secret
  hxAppSourceId: ci-app-source-id
  nucleusBaseUrl: http://nucleus-mock
  nucleusIdpBaseUrl: http://nucleus-idp-mock
  nucleusSystemId: test-system-id
