{{- if not .Values.messageBroker.existingConfigMap.name -}}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- $ctx := dict "Values" (dict "nameOverride" (printf "%s-%s" ($.Values.nameOverride | default $.Chart.Name) "mq")) "Chart" $.Chart "Release" $.Release }}
  name: {{ template "alfresco-connector-cic.fullname" $ctx }}
  labels:
    {{- include "alfresco-connector-cic.labels" . | nindent 4 }}
data:
  {{ template "alfresco-common.activemq.cm" (include "alfresco-connector-cic.activemq.url" .) }}
{{- end -}}
