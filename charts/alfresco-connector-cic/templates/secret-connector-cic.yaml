{{- if not .Values.cic.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "alfresco-connector-cic.fullname" . }}
  labels:
    {{- include "alfresco-connector-cic.labels" . | nindent 4 }}
type: Opaque
data:
  HX_CLIENT_ID: {{ required "cic.hxClientId is required" .Values.cic.hxClientId | b64enc | quote }}
  HX_CLIENT_SECRET: {{ required "cic.hxClientSecret is required" .Values.cic.hxClientSecret | b64enc | quote }}
  HX_ENV_KEY: {{ .Values.cic.hxEnvKey | default "" | b64enc | quote }}
  HX_APP_SOURCE_ID: {{ required "cic.hxAppSourceId is required" .Values.cic.hxAppSourceId | b64enc | quote }}
{{- end }}
