---
suite: message broker secret
templates:
  - secret-message-broker.yaml
values:
  - values/test_values.yaml
tests:
  - it: should not render without username and password
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when only username is provided
    set:
      configuration:
        messageBroker:
          username: mquser
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when only password is provided
    set:
      configuration:
        messageBroker:
          password: mqpass
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when an existingSecret is provided
    set:
      configuration:
        messageBroker:
          existingSecret:
            name: my-mq-secret
          username: mquser
          password: mqpass
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a secret with base64-encoded credentials
    set:
      configuration:
        messageBroker:
          username: mquser
          password: mqpass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secret-mq
      - equal:
          path: data.BROKER_USERNAME
          value: bXF1c2Vy
      - equal:
          path: data.BROKER_PASSWORD
          value: bXFwYXNz
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/component: alfresco-repository
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
