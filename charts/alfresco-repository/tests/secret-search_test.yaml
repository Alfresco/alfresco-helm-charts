---
suite: search secret
templates:
  - secret-search.yaml
values:
  - values/test_values.yaml
tests:
  - it: should not render with default noindex flavor
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render for solr6 without credentials
    set:
      configuration:
        search:
          flavor: solr6
          url: https://search.domain.tld/index
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render for elasticsearch without credentials
    set:
      configuration:
        search:
          flavor: elasticsearch
          url: https://search.domain.tld/index
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when an existingSecret is provided
    set:
      configuration:
        search:
          flavor: elasticsearch
          url: https://search.domain.tld/index
          username: esuser
          password: espass
          existingSecret:
            name: my-existing-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a solr-secret only for solr6
    set:
      configuration:
        search:
          flavor: solr6
          url: https://search.domain.tld/index
          solr-secret: mysolrsecret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secret-search
      - equal:
          path: data.SOLR_SECRET
          value: bXlzb2xyc2VjcmV0
      - notExists:
          path: data.ELASTICSEARCH_USERNAME
      - notExists:
          path: data.ELASTICSEARCH_PASSWORD

  - it: should render elasticsearch credentials only
    set:
      configuration:
        search:
          flavor: elasticsearch
          url: https://search.domain.tld/index
          username: esuser
          password: espass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.ELASTICSEARCH_USERNAME
          value: ZXN1c2Vy
      - equal:
          path: data.ELASTICSEARCH_PASSWORD
          value: ZXNwYXNz
      - notExists:
          path: data.SOLR_SECRET

  - it: should render both solr-secret and elasticsearch credentials
    set:
      configuration:
        search:
          flavor: elasticsearch
          url: https://search.domain.tld/index
          username: esuser
          password: espass
          solr-secret: mysolrsecret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.SOLR_SECRET
          value: bXlzb2xyc2VjcmV0
      - equal:
          path: data.ELASTICSEARCH_USERNAME
          value: ZXN1c2Vy
      - equal:
          path: data.ELASTICSEARCH_PASSWORD
          value: ZXNwYXNz
