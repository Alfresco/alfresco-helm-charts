---
suite: smtp service
templates:
  - service-smtp.yaml
values:
  - values/test_values.yaml
tests:
  - it: should not render when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render with default smtp port
    set:
      configuration:
        smtp:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-alfresco-repository-smtp
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.externalTrafficPolicy
          value: Local
      - contains:
          path: spec.ports
          content:
            name: smtp
            port: 1025
            protocol: TCP
            targetPort: 1025

  - it: should render with custom port
    set:
      configuration:
        smtp:
          enabled: true
          port: 1587
    asserts:
      - contains:
          path: spec.ports
          content:
            name: smtp
            port: 1587
            protocol: TCP
            targetPort: 1587

  - it: should render provided annotations
    set:
      configuration:
        smtp:
          enabled: true
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
            a8r.io/description: repo SMTP endpoint
    asserts:
      - equal:
          path: metadata.annotations['service.beta.kubernetes.io/aws-load-balancer-type']
          value: nlb
      - equal:
          path: metadata.annotations['a8r.io/description']
          value: repo SMTP endpoint

  - it: should render selector labels pointing at the repository pods
    set:
      configuration:
        smtp:
          enabled: true
    asserts:
      - isSubset:
          path: spec.selector
          content:
            app.kubernetes.io/name: alfresco-repository
            app.kubernetes.io/instance: RELEASE-NAME

  - it: should honor nameOverride for service name and labels
    set:
      nameOverride: myrepo
      configuration:
        smtp:
          enabled: true
    chart:
      version: 1.0.0
      appVersion: 2.0.0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-myrepo-smtp
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: myrepo-smtp
            app.kubernetes.io/component: alfresco-repository
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/version: 2.0.0
            helm.sh/chart: alfresco-repository-1.0.0
