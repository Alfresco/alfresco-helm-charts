{{- if .Values.activemq.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: activemq
data:
  {{- include "alfresco-common.activemq.cm" (required "activemq.url is required" .Values.activemq.url) | nindent 2 }}
  failover_url: {{ include "alfresco-common.activemq.url.withFailover" .Values.activemq.url | quote }}
---
apiVersion: v1
kind: Pod
metadata:
  name: activemq
spec:
  containers:
    - name: generic
      image: busybox
      env:
        {{- include "alfresco-common.activemq.env" . | nindent 8 }}
    - name: generic-alias
      image: busybox
      env:
        {{- include "activemq.env" . | nindent 8 }}
    - name: spring
      image: busybox
      env:
        {{- include "alfresco-common.spring.activemq.env" . | nindent 8 }}
    - name: spring-alias
      image: busybox
      env:
        {{- include "spring.activemq.env" . | nindent 8 }}
{{- end }}
