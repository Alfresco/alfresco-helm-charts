---
name: "Helm autodiscovery for charts dependencies"

autodiscovery:
  crawlers:
    helm:
      # Increment manually because we have custom rules
      versionincrement: none
      # Tags in values are handled separately via uber-manifest.tpl
      ignorecontainer: true
      versionfilter:
        kind: semver
        pattern: '>= 0.0.0-0'
      ignore:
        - dependencies:
            # https://github.com/updatecli/updatecli/issues/1876
            alfresco-insight-zeppelin: ""
            common: ""
            postgresql: ""
            elasticsearch: ""
